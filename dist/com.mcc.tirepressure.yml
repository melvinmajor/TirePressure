AutoName: TirePressure
Summary: Precision tire pressure calculator for Road, Gravel, MTB and Commute bikes.
Description: |-
  TirePressure is an offline, privacy-first tire pressure calculator based on
  Frank Berto's 15% tire drop deflection model, modern rolling impedance research,
  ETRTO / ISO safety standards and other tweaks to make the algorithm as accurate
  as possible.

  Features:
  * Pre-ride dashboard with instant optimal pressures for all registered bikes
  * Live multi-surface conditions (Dry, Rain, Snow)
  * Full Mullet / MX mixed wheel diameter support (e.g. 29" front / 27.5" rear)
  * Compatibility with emerging 32-inch wheels (686 mm ISO)
  * ETRTO / ISO hookless rim safety limit warnings
  * Clean Material 3 UI with glassmorphism design and customizable Home Screen widgets
  * Full bilingual support (English and French)
  * 100% offline: zero analytics, zero trackers, zero network permissions
  * JSON backup and restore via Storage Access Framework

